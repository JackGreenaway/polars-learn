name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install Python
        run: uv python install ${{ matrix.python-version }}
      - name: Install locked development dependencies
        run: uv sync --locked --python ${{ matrix.python-version }}
      - name: Test
        run: uv run --locked pytest --doctest-modules src tests
      - name: Lint
        run: uv run --locked ruff check .
      - name: Check formatting
        run: uv run --locked ruff format --check .
      - name: Check types
        run: uv run --locked pyright

  cross-version-persistence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install Python
        run: uv python install 3.11
      - name: Install locked dependencies
        run: uv sync --locked --python 3.11
      - name: Save with the locked Polars version and load with Polars 1.35.2
        run: |
          uv run --locked python tests/cross_version_persistence.py write "$RUNNER_TEMP/newer.pkl"
          uv run --locked --with polars==1.35.2 python tests/cross_version_persistence.py read "$RUNNER_TEMP/newer.pkl"
      - name: Save with Polars 1.35.2 and load with the locked Polars version
        run: |
          uv run --locked --with polars==1.35.2 python tests/cross_version_persistence.py write "$RUNNER_TEMP/older.pkl"
          uv run --locked python tests/cross_version_persistence.py read "$RUNNER_TEMP/older.pkl"

  minimum-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install Python
        run: uv python install 3.11
      - name: Create isolated environment
        run: uv venv --python 3.11 .venv-min
      - name: Install declared minimum runtime dependencies
        run: >-
          uv pip install --python .venv-min/bin/python --resolution lowest-direct
          "polars==1.20.0" "scikit-learn==1.6.0" "numpy==1.24.0"
          "cloudpickle>=3" "pytest>=8" "pandas>=2" "pyarrow>=14"
      - name: Install checkout without resolving newer dependencies
        run: uv pip install --python .venv-min/bin/python --no-deps -e .
      - name: Test minimum dependency set
        run: .venv-min/bin/python -m pytest --doctest-modules src tests

  wheel-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install Python
        run: uv python install 3.11
      - name: Build wheel
        run: uv build --wheel --out-dir dist
      - name: Install wheel in a clean environment
        run: |
          uv venv --python 3.11 .venv-wheel
          uv pip install --python .venv-wheel/bin/python dist/*.whl
      - name: Import installed package outside the checkout
        run: |
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/.venv-wheel/bin/python" -c 'import polars as pl; from polars_learn import SchemaValidator, ValueValidator; frame = pl.DataFrame({"x": [1, 2]}); assert ValueValidator({"positive": pl.col("x") > 0}).fit_transform(frame).equals(frame); assert SchemaValidator().fit_transform(frame).equals(frame)'
