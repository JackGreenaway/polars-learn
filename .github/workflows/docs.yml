name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install locked documentation and development dependencies
        run: uv sync --locked --group docs --python 3.11
      - name: Check class references match the implementation
        run: uv run --locked --group docs python scripts/build_api_reference.py --check
      - name: Check runnable documentation examples with Ruff
        run: uv run --locked --group docs python scripts/check_docs.py
      - name: Build documentation with strict link checks
        run: uv run --locked --group docs mkdocs build --strict
      - name: Verify rendered links and assets
        run: uv run --locked --group docs python scripts/check_site.py
      - name: Verify source doctests
        run: uv run --locked pytest --doctest-modules src -q
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
