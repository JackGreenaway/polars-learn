name: Upload Python Package

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      artifact-name:
        description: Existing distribution artifact from the calling workflow
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-latest
    steps:
      - name: Use distributions supplied by caller
        if: inputs.artifact-name != ''
        run: echo "Using the calling workflow's distribution artifact"
      - uses: actions/checkout@v4
        if: inputs.artifact-name == ''
      - uses: astral-sh/setup-uv@v5
        if: inputs.artifact-name == ''
      - name: Install Python
        if: inputs.artifact-name == ''
        run: uv python install 3.11
      - name: Install locked dependencies
        if: inputs.artifact-name == ''
        run: uv sync --locked --extra pandas --python 3.11
      - name: Check release version and package
        if: inputs.artifact-name == ''
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          uv run --locked --extra pandas python - <<'PY'
          import os
          import tomllib

          with open("pyproject.toml", "rb") as source:
              version = tomllib.load(source)["project"]["version"]
          from polars_learn import __version__

          if __version__ != version:
              raise SystemExit("Package __version__ must match project.version")
          expected = f"v{version}"
          if os.environ["RELEASE_TAG"] != expected:
              raise SystemExit(f"Release tag must match project.version: {expected}")
          PY
          uv run --locked --extra pandas pytest --doctest-modules src tests
          uv run --locked --extra pandas ruff check .
          uv run --locked --extra pandas ruff format --check .
          uv run --locked --extra pandas pyright
      - name: Build release distributions
        if: inputs.artifact-name == ''
        run: |
          uv build
          uvx twine check --strict dist/*
      - name: Upload distributions
        if: inputs.artifact-name == ''
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/
          if-no-files-found: error

  pypi-publish:
    runs-on: ubuntu-latest
    needs: release-build
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/polars-learn/
    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name || 'release-dists' }}
          path: dist/
      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
