site_name: polars-learn
site_description: Native Polars preparation for scikit-learn-style prediction pipelines.
site_url: https://jackgreenaway.github.io/polars-learn/
repo_url: https://github.com/JackGreenaway/polars-learn
repo_name: JackGreenaway/polars-learn
edit_uri: edit/main/docs/
strict: true
theme:
  name: mkdocs
  color_mode: auto
  user_color_mode_toggle: true
  nav_style: dark
  highlightjs: true
  hljs_languages:
    - python
    - bash
nav:
  - Home: index.md
  - Getting started: getting-started.md
  - User guide:
      - Estimators and pipelines: user-guide/estimators.md
      - Feature engineering: user-guide/features.md
      - Schema contracts: user-guide/schemas.md
      - Selection and passthrough: user-guide/selection.md
      - LazyFrames and pandas: user-guide/frames.md
      - Saving and loading: user-guide/persistence.md
      - Diagnostics and errors: user-guide/diagnostics.md
  - Classes:
      - FeatureEngineer: classes/feature-engineer.md
      - FeatureSpec: classes/feature-spec.md
      - SchemaSpec: classes/schema-spec.md
      - SchemaValidator: classes/schema-validator.md
      - ColumnSelector: classes/column-selector.md
      - FeaturePassthrough: classes/feature-passthrough.md
  - Examples:
      - Overview: examples/index.md
      - Lazy prediction pipeline: examples/lazy-pipeline.md
      - Cross-validation: examples/cross-validation.md
  - Production: production.md
  - API reference: api.md
  - Troubleshooting: troubleshooting.md
  - Development and Pages: development.md
plugins:
  - search
markdown_extensions:
  - admonition
  - toc:
      permalink: true
extra_css:
  - stylesheets/extra.css
validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    anchors: warn
