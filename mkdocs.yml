site_name: polars-learn
site_description: Native Polars preparation for scikit-learn-style prediction pipelines.
site_url: https://jackgreenaway.github.io/polars-learn/
repo_url: https://github.com/JackGreenaway/polars-learn
repo_name: JackGreenaway/polars-learn
edit_uri: edit/main/docs/
strict: true
theme:
  name: mkdocs
  custom_dir: docs_theme
  color_mode: dark
  user_color_mode_toggle: true
  nav_style: light
  highlightjs: true
  hljs_languages:
    - python
    - bash
nav:
  - Home: index.md
  - Getting started: getting-started.md
  - User guide:
      - Overview: user-guide/index.md
      - Raw data workflow: user-guide/pipeline-workflow.md
      - Estimators and pipelines: user-guide/estimators.md
      - Feature engineering: user-guide/features.md
      - Schema contracts: user-guide/schemas.md
      - Selection and passthrough: user-guide/selection.md
      - LazyFrames and pandas: user-guide/frames.md
      - Saving and loading: user-guide/persistence.md
      - Diagnostics and errors: user-guide/diagnostics.md
      - Column Selector Details: user-guide/column-selector-details.md
      - Feature Engineer Details: user-guide/feature-engineer-details.md
      - Feature Passthrough Details: user-guide/feature-passthrough-details.md
      - Feature Spec Details: user-guide/feature-spec-details.md
      - Schema Spec Details: user-guide/schema-spec-details.md
      - Schema Validator Details: user-guide/schema-validator-details.md
      - Value validation: user-guide/value-validation.md
  - API classes:
      - FeatureEngineer: classes/feature-engineer.md
      - FeatureSpec: classes/feature-spec.md
      - SchemaSpec: classes/schema-spec.md
      - SchemaValidator: classes/schema-validator.md
      - ValueValidator: classes/value-validator.md
      - ColumnSelector: classes/column-selector.md
      - FeaturePassthrough: classes/feature-passthrough.md
  - Examples:
      - Overview: examples/index.md
      - Held-out order fees: examples/held-out-orders.md
      - Lazy prediction pipeline: examples/lazy-pipeline.md
      - Cross-validation: examples/cross-validation.md
  - Additional workflows: legacy-workflows.md
  - Production: production.md
  - API reference: api.md
  - Errors and warnings: exceptions.md
  - Troubleshooting: troubleshooting.md
  - Development and Pages: development.md
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
extra_css:
  - stylesheets/extra.css
validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    anchors: warn
